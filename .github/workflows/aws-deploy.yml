name: aws-deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Missing AWS credentials in GitHub Secrets." >&2
            echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (and optionally AWS_SESSION_TOKEN)." >&2
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> "$GITHUB_ENV"
          if [ -n "${AWS_SESSION_TOKEN}" ]; then
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}" >> "$GITHUB_ENV"
          fi

      - name: Validate deploy configuration
        run: |
          echo "Region: ${AWS_REGION}"

      - name: Install CDK deps
        working-directory: cdk
        run: npm ci

      - name: Bootstrap (first-time only)
        working-directory: cdk
        run: |
          TOOLKIT_STATUS=$(aws cloudformation describe-stacks \
            --stack-name CDKToolkit \
            --region "${AWS_REGION}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "CDKToolkit stack status: ${TOOLKIT_STATUS}"

          if [[ "${TOOLKIT_STATUS}" == "CREATE_COMPLETE" || "${TOOLKIT_STATUS}" == "UPDATE_COMPLETE" ]]; then
            echo "CDKToolkit is already bootstrapped and healthy — skipping."
          else
            if [[ "${TOOLKIT_STATUS}" == "ROLLBACK_FAILED" || "${TOOLKIT_STATUS}" == "ROLLBACK_COMPLETE" || "${TOOLKIT_STATUS}" == "CREATE_FAILED" ]]; then
              echo "CDKToolkit stack is in a failed state (${TOOLKIT_STATUS}). Deleting before re-bootstrapping..."
              aws cloudformation delete-stack --stack-name CDKToolkit --region "${AWS_REGION}"
              aws cloudformation wait stack-delete-complete --stack-name CDKToolkit --region "${AWS_REGION}" || true
            fi
            echo "Bootstrapping CDK environment..."
            AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            npx cdk bootstrap "aws://${AWS_ACCOUNT}/${AWS_REGION}"
          fi

      - name: Deploy
        working-directory: cdk
        run: npx cdk deploy --require-approval never

