name: lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: "${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      # Run all services in parallel; don't cancel others if one fails.
      fail-fast: false
      matrix:
        service: [auth, collection, retrieval, visualisation]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        # Informational — shows type errors without failing the build.
        # Pre-existing structural issues in the shared/ module resolution
        # mean tsc cannot fully resolve all types from each service directory.
        run: npm run tsc -- --noEmit
        continue-on-error: true
