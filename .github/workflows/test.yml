name: backend-ci

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVICES: auth collection retrieval visualisation predictive e2e-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            services/auth/package-lock.json
            services/collection/package-lock.json
            services/retrieval/package-lock.json
            services/visualisation/package-lock.json
            services/predictive/package-lock.json
            services/e2e-runner/package-lock.json

      - name: Run ESLint for all microservices
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          mkdir -p lint-parts
          for svc in ${SERVICES}; do
            echo "==> Linting ${svc}"
            mkdir -p "lint-parts/${svc}"
            (
              cd "services/${svc}"
              npm ci
              set +e
              npm run lint -- -f json -o "../../lint-parts/${svc}/eslint-report.json"
              status=$?
              set -e
              echo "${status}" > "../../lint-parts/${svc}/eslint.exitcode"
              exit "${status}"
            ) || failed=1
          done
          exit "${failed}"

      - name: Upload lint report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-parts
          path: lint-parts
          if-no-files-found: warn

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVICES: auth collection retrieval visualisation predictive e2e-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            services/auth/package-lock.json
            services/collection/package-lock.json
            services/retrieval/package-lock.json
            services/visualisation/package-lock.json
            services/predictive/package-lock.json
            services/e2e-runner/package-lock.json

      - name: Run type-check for all microservices
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for svc in ${SERVICES}; do
            echo "==> Type-checking ${svc}"
            (
              cd "services/${svc}"
              npm ci
              npm run tsc -- --noEmit
            ) || failed=1
          done
          exit "${failed}"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVICES: auth collection retrieval visualisation predictive e2e-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            services/auth/package-lock.json
            services/collection/package-lock.json
            services/retrieval/package-lock.json
            services/visualisation/package-lock.json
            services/predictive/package-lock.json
            services/e2e-runner/package-lock.json

      - name: Run tests with coverage for all microservices
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          mkdir -p coverage-parts
          for svc in ${SERVICES}; do
            echo "==> Testing ${svc}"
            mkdir -p "coverage-parts/${svc}"
            (
              cd "services/${svc}"
              npm ci
              mkdir -p coverage
              set +e
              npm test -- --coverage --json --outputFile=coverage/jest-results.json 2>&1 | tee "../../coverage-parts/${svc}/jest-coverage-log.txt"
              status=${PIPESTATUS[0]}
              set -e
              cp -R coverage/. "../../coverage-parts/${svc}/" 2>/dev/null || true
              echo "${status}" > "../../coverage-parts/${svc}/jest.exitcode"
              exit "${status}"
            ) || failed=1
          done
          exit "${failed}"

      - name: Append coverage summary to job summary
        if: always()
        shell: bash
        run: |
          for svc in ${SERVICES}; do
            SVC_NAME="${svc}" node <<'NODE'
            const fs = require("fs");
            const p = `coverage-parts/${process.env.SVC_NAME}/coverage-summary.json`;
            if (!fs.existsSync(p)) {
              console.log(`No ${p}`);
              process.exit(0);
            }
            const s = JSON.parse(fs.readFileSync(p, "utf8"));
            const total = s.total || {};
            const lines = [
              "### Jest coverage: " + process.env.SVC_NAME,
              "",
              "| Metric | Covered |",
              "| --- | --- |",
            ];
            for (const key of ["lines", "statements", "functions", "branches"]) {
              const v = total[key];
              if (v && typeof v.pct === "number") {
                lines.push("| " + key + " | " + v.pct + "% |");
              }
            }
            lines.push("");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          NODE
          done

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-parts
          path: coverage-parts
          if-no-files-found: warn

  coverage-aggregate:
    name: testing-report
    needs: [test, lint, typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-parts
          path: coverage-parts

      - name: Download lint artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lint-parts
          path: lint-parts

      - name: Generate combined CI report (tests + coverage + lint)
        run: |
          set -euo pipefail
          mkdir -p coverage-parts lint-parts
          node scripts/generate-combined-ci-report.js coverage-parts lint-parts testing-report

      - name: Append combined CI report to workflow summary
        if: always()
        run: |
          if [ -f testing-report/COMBINED-CI-REPORT.md ]; then
            {
              echo ""
              cat testing-report/COMBINED-CI-REPORT.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail aggregate job if any validation job failed
        if: always()
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "${LINT_RESULT}" != "success" ] || [ "${TYPECHECK_RESULT}" != "success" ] || [ "${TEST_RESULT}" != "success" ]; then
            echo "At least one backend validation job failed."
            echo "lint=${LINT_RESULT}"
            echo "typecheck=${TYPECHECK_RESULT}"
            echo "test=${TEST_RESULT}"
            exit 1
          fi

      - name: Upload combined CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-report
          path: |
            testing-report/coverage-summary.json
            testing-report/COMBINED-CI-REPORT.md
            testing-report/COMBINED-CI-REPORT.txt
            testing-report/COVERAGE-REPORT.md
            testing-report/COVERAGE-REPORT.txt
          if-no-files-found: warn
