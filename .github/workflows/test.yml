name: test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

jobs:
  test:
    name: "${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [auth, collection, retrieval, visualisation, e2e-runner]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Append coverage summary to job summary
        if: always()
        working-directory: services/${{ matrix.service }}
        env:
          SVC_NAME: ${{ matrix.service }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const p = "coverage/coverage-summary.json";
          if (!fs.existsSync(p)) {
            console.log("No coverage/coverage-summary.json");
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, "utf8"));
          const total = s.total || {};
          const lines = [
            "### Jest coverage: " + process.env.SVC_NAME,
            "",
            "| Metric | Covered |",
            "| --- | --- |",
          ];
          for (const key of ["lines", "statements", "functions", "branches"]) {
            const v = total[key];
            if (v && typeof v.pct === "number") {
              lines.push("| " + key + " | " + v.pct + "% |");
            }
          }
          lines.push("");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          NODE

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage
          if-no-files-found: warn

  coverage-aggregate:
    name: coverage-combined
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lcov (genhtml)
        run: sudo apt-get update && sudo apt-get install -y lcov

      # Matrix legs may fail before upload; downloads use continue-on-error so we still merge partial inputs.
      - name: Download coverage-auth
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-auth
          path: coverage-parts/auth

      - name: Download coverage-collection
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-collection
          path: coverage-parts/collection

      - name: Download coverage-retrieval
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-retrieval
          path: coverage-parts/retrieval

      - name: Download coverage-visualisation
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-visualisation
          path: coverage-parts/visualisation

      - name: Download coverage-e2e-runner
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-e2e-runner
          path: coverage-parts/e2e-runner

      - name: Merge LCOV and HTML report
        run: |
          set -euo pipefail
          mkdir -p coverage-parts coverage-combined/lcov-report
          COUNT=$(find coverage-parts -name lcov.info -type f | wc -l)
          if [ "${COUNT}" -eq 0 ]; then
            echo "::warning::No lcov.info inputs found under coverage-parts; skipping merged HTML."
          else
            npx --yes lcov-result-merger@5.0.1 "coverage-parts/**/lcov.info" merged.lcov
            genhtml merged.lcov -o coverage-combined/lcov-report --branch-coverage --ignore-errors source --quiet
          fi

      - name: Merge coverage-summary.json (platform totals)
        run: |
          set -euo pipefail
          mkdir -p coverage-parts
          if ! find coverage-parts -name coverage-summary.json -type f | grep -q .; then
            echo "::warning::No coverage-summary.json under coverage-parts; skipping merged summary JSON."
            mkdir -p coverage-combined
            printf '%s\n' '{"total":{}}' > coverage-combined/coverage-summary.json
          else
            node scripts/aggregate-coverage-summary.js coverage-parts coverage-combined/coverage-summary.json
          fi

      - name: Append combined coverage to workflow summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require("fs");
          const p = "coverage-combined/coverage-summary.json";
          if (!fs.existsSync(p)) process.exit(0);
          const s = JSON.parse(fs.readFileSync(p, "utf8"));
          const total = s.total || {};
          const lines = [
            "### Combined Jest coverage (all services)",
            "",
            "Per-service matrices above are unchanged; this table sums coverage across downloaded artifacts.",
            "",
            "| Metric | Covered |",
            "| --- | --- |",
          ];
          for (const key of ["lines", "statements", "functions", "branches"]) {
            const v = total[key];
            if (v && typeof v.pct === "number") {
              lines.push("| " + key + " | " + v.pct + "% |");
            }
          }
          lines.push("");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          NODE

      - name: Upload combined coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: |
            coverage-combined/coverage-summary.json
            coverage-combined/lcov-report
          if-no-files-found: warn
